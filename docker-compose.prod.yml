services:
  backend:
    ports: !override []
    expose:
      - "8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - ANALYST_PIN=${ANALYST_PIN:?Set ANALYST_PIN explicitly in deploy/.env.prod}

  frontend:
    ports: !override []
    expose:
      - "3000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-verishield.joiboi.app}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
